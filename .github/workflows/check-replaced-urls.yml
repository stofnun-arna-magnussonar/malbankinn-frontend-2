name: Check for new CLARIN submissions

on:
  schedule:
    - cron: "0 8 1,15 * *" # 1st and 15th of each month at 08:00 UTC
  workflow_dispatch: # Allow manual runs

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check for new handles
        id: check
        run: node scripts/check-new-submissions.js
        continue-on-error: true

      - name: Commit updated state file
        if: steps.check.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/repo-state.json
          git commit -m "chore: update lastKnownHandle after new submissions"
          git push

      - name: Create GitHub Issue with new submissions
        if: steps.check.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "New CLARIN repository submissions found"
          content-filepath: new-submissions-report.md
          labels: automated,clarin-report

      - name: Send email notification
        if: steps.check.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: helgasvala@hi.is
          from: Málbankinn <${{ secrets.MAIL_USERNAME }}>
          subject: "New CLARIN repository submissions found"
          body: file://new-submissions-report.md
